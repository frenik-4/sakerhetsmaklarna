# Bygger sajten och laddar upp den till testmiljön asparagus.se/sakerhetsmaklarna/ via SFTP (Inleed)
# Repo-secrets: SFTP_HOST, SFTP_PORT, SFTP_USERNAME, SFTP_PASSWORD, SFTP_DIR, SFTP_KNOWN_HOSTS
name: Deploy test (asparagus.se)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://asparagus.se
          BASE_PATH: /sakerhetsmaklarna
      - name: Installera lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Ladda upp via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Speglar bara dist/ till sakerhetsmaklarna-mappen. --delete tar bort gamla
          # filer där, men config.php och ms-config.php på servern lämnas orörda.
          lftp -u "$SFTP_USERNAME" --env-password -p "$SFTP_PORT" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm no;
            set net:max-retries 2;
            set net:timeout 30;
            mkdir -p -f $SFTP_DIR;
            mirror --reverse --delete --parallel=4 --exclude-glob api/config.php --exclude-glob api/ms-config.php dist/ $SFTP_DIR;
            quit"
